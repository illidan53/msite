        name: Memory & interfaces
        expandedByDefault: true
        symbols:
          - MU
          - RMBS
      - id: segment-5
        name: Analog, power & embedded
        expandedByDefault: true
        symbols:
          - QCOM
          - TXN
          - ADI
          - NXPI
          - ON
          - MPWR
          - MCHP
          - LSCC
      - id: segment-6
        name: Photonics & AI interconnect
        expandedByDefault: true
        symbols:
          - MRVL
          - ALAB
          - CRDO
          - LITE
          - COHR
          - NOK
          - SMTC
    navigationGroup: primary
    selectionNote: Coverage-led selection across compute, manufacturing, equipment, memory, analog and interconnect. Retains user-requested LITE, NOK, CRDO and ALAB; NOK is adjacent optical networking exposure, not a pure semiconductor company.
