watchlists:
  - id: semiconductors
    name: Semiconductors
    description: Semiconductor leaders across six supply-chain segments, including user-focused photonics and AI interconnect
    theme: semiconductors
    pinnedSymbols:
      - NVDA
      - AMD
    symbolDescriptions:
      LITE: Photonics, lasers, and optical modules for cloud and AI networks
      NOK: Optical networking and data-center interconnect; a diversified network equipment business
      CRDO: High-speed connectivity, active electrical cables, SerDes, and optical DSPs
      ALAB: PCIe, CXL, and Ethernet connectivity for AI and cloud infrastructure
    rows:
      - id: segment-1
        name: AI compute & chip platforms
        expandedByDefault: true
        symbols:
          - NVDA
          - AMD
          - AVGO
          - ARM
      - id: segment-2
        name: Foundries & manufacturing
        expandedByDefault: true
        symbols:
          - TSM
          - INTC
          - GFS
      - id: segment-3
        name: Equipment & testing
        expandedByDefault: true
